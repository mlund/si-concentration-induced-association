[project]
name = "wertheim"
version = "0.1.0"
description = "Wertheim integral-equation theory for one-site associating spheres"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wertheim"]
